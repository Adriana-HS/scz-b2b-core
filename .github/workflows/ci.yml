name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# Un solo run por rama: si llega un commit nuevo, se cancela el anterior (ahorra minutos).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Cadena de suministro (SYSTEM_DESIGN.md §8.6): cada action se fija por el SHA completo del commit,
# con la versión en un comentario. Una etiqueta (@v7) se puede mover a otro código; un SHA no.
# Dependabot actualiza el SHA y el comentario juntos; scripts/ci/check_repo.py rechaza `uses:` sin SHA.

env:
  # Versiones fijas para que la CI sea reproducible. Actualizarlas a propósito, en su propio PR.
  SUPABASE_CLI_VERSION: 2.120.0
  GITLEAKS_VERSION: 8.21.2
  # sha256 de gitleaks_<versión>_linux_x64.tar.gz según el checksums.txt de la release oficial
  GITLEAKS_SHA256: 5bc41815076e6ed6ef8fbecc9d9b75bcae31f39029ceb55da08086315316e3ba
  UV_VERSION: 0.13.1

jobs:
  database:
    name: Base de datos (migraciones + pgTAP)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false   # la CI nunca hace push: el token no queda en disco

      - uses: supabase/setup-cli@45a513f8c64c0bc8e0e3dfe572b5c95be85f6359 # v3.0.1
        with:
          version: ${{ env.SUPABASE_CLI_VERSION }}

      # Levanta solo Postgres (imagen oficial de Supabase, con los esquemas auth y storage)
      # y aplica supabase/migrations en orden. Si una migración falla, el job falla aquí.
      - name: Levantar Postgres de Supabase y aplicar migraciones
        run: supabase db start

      - name: Pruebas pgTAP
        run: supabase test db

      # plpgsql_check sobre las funciones. Bloquea el PR: el primer reporte (run 38836685095,
      # 16-oct-2026) salió sin errores, así que cualquier error nuevo es una regresión.
      - name: Lint de funciones (plpgsql_check)
        run: supabase db lint --level error --fail-on error

      - name: Logs de Postgres si algo falló
        if: failure()
        run: docker ps -a --format '{{.Names}}' | grep -E 'supabase_db' | xargs -r -I{} docker logs --tail 200 {}

      - name: Detener
        if: always()
        run: supabase stop --no-backup

  backend:
    name: Backend (ruff, mypy, import-linter, pytest, pip-audit)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    env:
      SCZ_REQUIRE_DB: "1"   # las pruebas de integración fallan (no se omiten) si no hay BD
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false   # la CI nunca hace push: el token no queda en disco

      # Postgres de Supabase con las migraciones, para las pruebas de integración como app_backend
      - uses: supabase/setup-cli@45a513f8c64c0bc8e0e3dfe572b5c95be85f6359 # v3.0.1
        with:
          version: ${{ env.SUPABASE_CLI_VERSION }}
      - name: Levantar Postgres de Supabase y aplicar migraciones
        working-directory: .
        run: supabase db start

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
          prune-cache: true   # desde v9 el default es false y la caché crecería sin límite

      # Python 3.12 desde backend/.python-version; --locked falla si uv.lock no coincide con pyproject.toml
      - name: Instalar dependencias exactas
        run: uv sync --locked

      - name: Lint y formato (ruff)
        run: uv run ruff check . && uv run ruff format --check .

      - name: Tipos (mypy --strict)
        run: uv run mypy app tests

      - name: Regla de dependencias entre capas (import-linter)
        run: uv run lint-imports

      - name: Pruebas unitarias y de integración con cobertura (pytest, mínimo 85 %)
        run: uv run pytest -rs

      - name: Vulnerabilidades conocidas en dependencias (pip-audit)
        run: uv run pip-audit --skip-editable --progress-spinner off

      - name: Detener Postgres
        if: always()
        working-directory: .
        run: supabase stop --no-backup

  repo:
    name: Consistencia del repo (backlog, enlaces, ADRs, migraciones)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false   # la CI nunca hace push: el token no queda en disco
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: python scripts/ci/check_repo.py

  secrets:
    name: Búsqueda de secretos (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # Se usa el binario (licencia MIT) y no gitleaks-action, que pide una licencia
      # de pago cuando el repo pertenece a una organización.
      # Se descarga a un archivo y se verifica el sha256 ANTES de extraer y ejecutar el binario.
      - name: Instalar gitleaks (verificado por checksum)
        run: |
          curl -sSfL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum --check --strict
          tar -xzf gitleaks.tar.gz gitleaks
      - name: Revisar todo el historial
        run: ./gitleaks git --redact --verbose --exit-code 1 .
