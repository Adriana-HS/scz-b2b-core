name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# Un solo run por rama: si llega un commit nuevo, se cancela el anterior (ahorra minutos).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Versiones fijas para que la CI sea reproducible. Actualizarlas a propósito, en su propio PR.
  SUPABASE_CLI_VERSION: 2.120.0
  GITLEAKS_VERSION: 8.21.2

jobs:
  database:
    name: Base de datos (migraciones + pgTAP)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: ${{ env.SUPABASE_CLI_VERSION }}

      # Levanta solo Postgres (imagen oficial de Supabase, con los esquemas auth y storage)
      # y aplica supabase/migrations en orden. Si una migración falla, el job falla aquí.
      - name: Levantar Postgres de Supabase y aplicar migraciones
        run: supabase db start

      - name: Pruebas pgTAP
        run: supabase test db

      # plpgsql_check sobre las funciones. Bloquea el PR: el primer reporte (run 38836685095,
      # 16-oct-2026) salió sin errores, así que cualquier error nuevo es una regresión.
      - name: Lint de funciones (plpgsql_check)
        run: supabase db lint --level error --fail-on error

      - name: Logs de Postgres si algo falló
        if: failure()
        run: docker ps -a --format '{{.Names}}' | grep -E 'supabase_db' | xargs -r -I{} docker logs --tail 200 {}

      - name: Detener
        if: always()
        run: supabase stop --no-backup

  repo:
    name: Consistencia del repo (backlog, enlaces, ADRs, migraciones)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/ci/check_repo.py

  secrets:
    name: Búsqueda de secretos (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Se usa el binario (licencia MIT) y no gitleaks-action, que pide una licencia
      # de pago cuando el repo pertenece a una organización.
      - name: Instalar gitleaks
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz gitleaks
      - name: Revisar todo el historial
        run: ./gitleaks git --redact --verbose --exit-code 1 .
