# Hooks locales: `pip install pre-commit && pre-commit install`
# Se ejecutan en cada `git commit` y bloquean secretos, archivos grandes y errores de formato.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-added-large-files
        args: ["--maxkb=500"]
      - id: check-merge-conflict
      - id: check-yaml
      - id: check-json
      - id: check-toml
      - id: detect-private-key
      - id: end-of-file-fixer
        exclude: ^docs/reviews/evidence/
      - id: trailing-whitespace
        exclude: ^(docs/reviews/evidence/|.*\.md$)
      - id: mixed-line-ending
        args: ["--fix=lf"]
        exclude: \.(ps1|bat|cmd)$
      - id: no-commit-to-branch
        args: ["--branch", "main"]
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks
