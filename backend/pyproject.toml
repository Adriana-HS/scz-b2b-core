[project]
name = "scz-b2b-core-backend"
version = "0.1.0"
description = "Backend de SCZ-B2B-Core: procesos api (FastAPI) y worker sobre un monolito modular hexagonal"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "Propietario. Todos los derechos reservados (ver LICENSE en la raíz)" }
authors = [{ name = "Adriana Hernández Severich" }]
dependencies = [
    "asyncpg>=0.30",
    "fastapi>=0.115",
    "httpx>=0.27",          # cliente de la WhatsApp Cloud API
    "opentelemetry-api>=1.27",
    "opentelemetry-exporter-otlp-proto-http>=1.27",
    "opentelemetry-sdk>=1.27",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "reportlab>=5.0",       # PDF de cotización (#26, SYSTEM_DESIGN §4)
    "sentry-sdk>=2.18",
    "tzdata>=2025.2",       # zonas horarias en cualquier SO: fechas del PDF en hora del negocio (#26)
    "uvicorn[standard]>=0.32",
]

[dependency-groups]
dev = [
    "asyncpg-stubs>=0.30",
    "import-linter>=2.1",
    "mypy>=1.13",
    "pip-audit>=2.7",
    "pypdf>=6.0",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "pytest-timeout>=2.3",
    "pyyaml>=6.0",
    "ruff>=0.8",
    "types-pyyaml>=6.0",
    "types-reportlab>=4.4",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

# ---------------------------------------------------------------------------
# Calidad (SYSTEM_DESIGN.md §13.2, Q-MAINT-2)
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = [
    "E", "W", "F",   # pycodestyle + pyflakes
    "I",             # orden de imports
    "B",             # bugbear
    "UP",            # pyupgrade
    "S",             # bandit (seguridad)
    "N",             # nombres
    "SIM", "RUF",
    "DTZ",           # datetime sin zona horaria (todo es timestamptz)
    "ASYNC",
    "T20",           # sin print(): logs estructurados
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]   # assert y secretos ficticios en pruebas
"loadtest/**" = ["T201"]                # herramientas de línea de comandos: imprimen el reporte
"app/verticals/**" = ["E501"]            # prompts: prosa que lee el modelo; partirla cambiaría el texto

[tool.mypy]
strict = true
python_version = "3.12"
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
# Una prueba colgada falla a los 120 s con el traceback de dónde quedó, en vez de trabar la suite.
timeout = 120
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
markers = [
    "integration: requiere el Postgres local de Supabase (`supabase db start`); se omite si no está",
]
addopts = "-q --strict-markers --cov=app --cov-report=term-missing --cov-fail-under=85"
# Los avisos son errores, salvo el de Starlette sobre httpx en TestClient: sugiere otro paquete
# (httpx2) que aún no se evaluó como dependencia. Revisar al actualizar FastAPI/Starlette.
filterwarnings = [
    "error",
    "ignore:Using `httpx` with `starlette.testclient` is deprecated",
]

[tool.coverage.run]
branch = true

# ---------------------------------------------------------------------------
# Regla de dependencias (docs/architecture/principios-y-patrones.md §1.1, ADR-0001)
# Las flechas solo apuntan hacia el dominio. `lint-imports` falla si alguien la rompe.
# ---------------------------------------------------------------------------
[tool.importlinter]
root_package = "app"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "El dominio no depende de ninguna otra capa ni de SDKs (solo stdlib y pydantic)"
type = "forbidden"
source_modules = ["app.domain"]
forbidden_modules = [
    "app.application", "app.infrastructure", "app.api", "app.workers", "app.verticals", "app.core",
    "app.main", "app.worker",
    "fastapi", "starlette", "uvicorn", "pydantic_settings", "httpx",
]

[[tool.importlinter.contracts]]
name = "La aplicación depende del dominio, no de adaptadores ni de la interfaz"
type = "forbidden"
source_modules = ["app.application"]
forbidden_modules = [
    "app.infrastructure", "app.api", "app.workers", "app.main", "app.worker",
    "fastapi", "starlette", "uvicorn", "httpx",
]

[[tool.importlinter.contracts]]
name = "Los adaptadores de salida no dependen de la interfaz ni de la aplicación"
type = "forbidden"
source_modules = ["app.infrastructure"]
forbidden_modules = ["app.api", "app.workers", "app.application", "app.main", "app.worker"]

[[tool.importlinter.contracts]]
name = "Los rubros (VerticalPolicy) no dependen de adaptadores ni de la interfaz"
type = "forbidden"
source_modules = ["app.verticals"]
forbidden_modules = ["app.infrastructure", "app.api", "app.workers", "app.main", "app.worker"]

[[tool.importlinter.contracts]]
name = "Las entradas (api y workers) no se importan entre sí; se componen en main.py y worker.py"
type = "independence"
modules = ["app.api", "app.workers"]
